<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" font-family="Manrope, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7fc8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b96a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="780" fill="#030710"/>

  <text x="48" y="60" fill="#ffffff" font-size="28" font-weight="700">PR Wrangler</text>
  <text x="48" y="88" fill="#8b96a8" font-size="15">An AI review queue for teams shipping with coding agents</text>

  <!-- Inputs -->
  <rect x="48" y="196" width="220" height="80" rx="12" fill="#0c1524" stroke="#2f4b68"/>
  <text x="158" y="228" fill="#e5f4ff" font-size="17" font-weight="700" text-anchor="middle">Triggers</text>
  <text x="158" y="253" fill="#8b96a8" font-size="13" text-anchor="middle">Chat · PR events · 9am cron</text>

  <rect x="48" y="326" width="220" height="80" rx="12" fill="#0c1524" stroke="#2f4b68"/>
  <text x="158" y="358" fill="#e5f4ff" font-size="17" font-weight="700" text-anchor="middle">GitHub MCP</text>
  <text x="158" y="383" fill="#8b96a8" font-size="13" text-anchor="middle">Read-only PR access</text>

  <!-- Deep Agent runtime -->
  <rect x="310" y="128" width="640" height="510" rx="20" fill="#0b1f1f" stroke="#1d3d3c" stroke-width="1.5"/>
  <text x="338" y="164" fill="#ffffff" font-size="18" font-weight="700">PR Wrangler — Deep Agent</text>
  <text x="338" y="186" fill="#8b9c9c" font-size="13">LangChain Deep Agents · managed runtime (MDA)</text>

  <rect x="338" y="204" width="584" height="64" rx="12" fill="#1d3d3c" stroke="#7fc8ff" stroke-opacity="0.55"/>
  <text x="630" y="231" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Orchestrator</text>
  <text x="630" y="254" fill="#bbc4c4" font-size="13" text-anchor="middle">Delegates each job · code guardrails check every step</text>

  <rect x="338" y="306" width="282" height="78" rx="12" fill="#1d3d3c" stroke="#2f5a58"/>
  <text x="479" y="336" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Review guide</text>
  <text x="479" y="360" fill="#bbc4c4" font-size="13" text-anchor="middle">One PR → structured brief</text>

  <rect x="640" y="306" width="282" height="78" rx="12" fill="#1d3d3c" stroke="#2f5a58"/>
  <text x="781" y="336" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Dependency gate</text>
  <text x="781" y="360" fill="#bbc4c4" font-size="13" text-anchor="middle">package.json + advisories → flags</text>

  <!-- Shared state -->
  <rect x="338" y="414" width="584" height="74" rx="12" fill="none" stroke="#99d3ff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="630" y="438" fill="#99d3ff" font-size="12" font-weight="700" letter-spacing="0.6" text-anchor="middle">SHARED AGENT STATE</text>
  <rect x="358" y="450" width="180" height="26" rx="6" fill="#132d2d"/>
  <text x="448" y="468" fill="#cce9ff" font-size="13" text-anchor="middle" font-family="Menlo, monospace">/briefs/{pr}.json</text>
  <rect x="690" y="450" width="182" height="26" rx="6" fill="#132d2d"/>
  <text x="781" y="468" fill="#cce9ff" font-size="13" text-anchor="middle" font-family="Menlo, monospace">/deps.json</text>

  <rect x="338" y="530" width="584" height="78" rx="12" fill="#1d3d3c" stroke="#2f5a58"/>
  <text x="630" y="560" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Queue planner</text>
  <text x="630" y="584" fill="#bbc4c4" font-size="13" text-anchor="middle">Briefs + dependency facts → prioritized queue</text>

  <!-- Flow inside the runtime -->
  <line x1="479" y1="268" x2="479" y2="302" stroke="#7fc8ff" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="781" y1="268" x2="781" y2="302" stroke="#7fc8ff" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="491" y="290" fill="#7fc8ff" font-size="12">task</text>
  <text x="793" y="290" fill="#7fc8ff" font-size="12">task</text>
  <line x1="448" y1="384" x2="448" y2="446" stroke="#7fc8ff" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="781" y1="384" x2="781" y2="446" stroke="#7fc8ff" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="458" y="404" fill="#7fc8ff" font-size="12">writes</text>
  <text x="791" y="404" fill="#7fc8ff" font-size="12">writes</text>
  <line x1="630" y1="488" x2="630" y2="526" stroke="#7fc8ff" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="640" y="512" fill="#7fc8ff" font-size="12">reads both</text>

  <!-- Inputs into the runtime -->
  <path d="M268 236 L300 236 L300 236 L334 236" fill="none" stroke="#7fc8ff" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M268 366 L300 366 L300 345 L334 345" fill="none" stroke="#7fc8ff" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Outputs -->
  <rect x="1000" y="196" width="232" height="80" rx="12" fill="#0c1524" stroke="#2f4b68"/>
  <text x="1116" y="228" fill="#e5f4ff" font-size="17" font-weight="700" text-anchor="middle">Slack</text>
  <text x="1116" y="253" fill="#8b96a8" font-size="13" text-anchor="middle">#daily-pr-review + author DMs</text>

  <rect x="1000" y="326" width="232" height="80" rx="12" fill="#0c1524" stroke="#2f4b68"/>
  <text x="1116" y="358" fill="#e5f4ff" font-size="17" font-weight="700" text-anchor="middle">GitHub</text>
  <text x="1116" y="383" fill="#8b96a8" font-size="13" text-anchor="middle">Labels · comments · pinned queue</text>

  <rect x="1000" y="530" width="232" height="78" rx="12" fill="#0c1524" stroke="#7fc8ff" stroke-opacity="0.55"/>
  <text x="1116" y="560" fill="#e5f4ff" font-size="17" font-weight="700" text-anchor="middle">Publish</text>
  <text x="1116" y="584" fill="#8b96a8" font-size="13" text-anchor="middle">Plain code · runs every time</text>

  <line x1="922" y1="569" x2="996" y2="569" stroke="#7fc8ff" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="959" y="557" fill="#7fc8ff" font-size="11" font-family="Menlo, monospace" text-anchor="middle">queue.json</text>
  <line x1="1116" y1="530" x2="1116" y2="410" stroke="#7fc8ff" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M1232 569 L1256 569 L1256 236 L1236 236" fill="none" stroke="#7fc8ff" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Follow-up loop -->
  <path d="M1116 608 L1116 664 L24 664 L24 236 L44 236" fill="none" stroke="#8b96a8" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#g)"/>
  <text x="48" y="654" fill="#8b96a8" font-size="13">Follow-up: a PR is updated → webhook → re-review only that PR</text>

  <!-- Observability -->
  <rect x="48" y="690" width="1184" height="62" rx="12" fill="#1a1740" stroke="#beb4fd" stroke-opacity="0.7"/>
  <text x="640" y="717" fill="#ebe8fe" font-size="17" font-weight="700" text-anchor="middle">LangSmith · tracing and Studio</text>
  <text x="640" y="739" fill="#cfc8fe" font-size="13" text-anchor="middle">Every agent run, tool call, token and cost</text>
</svg>
